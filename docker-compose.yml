services:
  backend:
    build: ./backend
    container_name: netvista-api
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - netvista-data:/data
    environment:
      - DATABASE_URL=/data/netvista.db
      - HOST=0.0.0.0
      - PORT=8040
      # Optional API key (empty = auth disabled). Set in a .env file or shell.
      - API_KEY=${API_KEY:-}
      - MAX_TARGET_ADDRESSES=${MAX_TARGET_ADDRESSES:-65536}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5175}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: netvista-frontend
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  netvista-data:
